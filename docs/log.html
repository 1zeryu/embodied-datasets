<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新日志 · 具身智能数据集索引</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f7f9;
    --border: #e3e6ea;
    --text: #1d2129;
    --muted: #6b7280;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header, main { max-width: 820px; margin: 0 auto; padding: 0 24px; }
  header { padding-top: 48px; padding-bottom: 8px; }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.2px; }
  .sub { margin: 0 0 10px; color: var(--muted); }
  .meta { margin: 0; font-size: 13px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .entry { padding: 26px 0; border-bottom: 1px solid var(--border); }
  .entry:last-child { border-bottom: none; }
  .date { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .counts { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  h3 {
    font-size: 12.5px; font-weight: 600; color: var(--muted);
    margin: 18px 0 8px; letter-spacing: .04em;
  }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 6px 0; }
  li strong { font-weight: 600; }
  .note {
    margin: 14px 0 0; padding: 10px 14px; background: var(--panel);
    border-radius: 8px; color: var(--muted); font-size: 13px;
  }
  .empty { padding: 56px 0; text-align: center; color: var(--muted); }
  footer { max-width: 820px; margin: 0 auto; padding: 24px 24px 56px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>

<header>
  <h1>更新日志</h1>
  <p class="sub">每天定时任务新增或修改了哪些数据集。</p>
  <p class="meta"><a href="./index.html">← 返回数据集索引</a></p>
</header>

<main id="timeline"></main>
<p class="empty" id="empty" hidden>暂无日志记录。</p>

<footer>日志由每日定时任务自动生成，记录每次运行的新增与变更。</footer>

<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

fetch('./data/changelog.json')
  .then(r => r.json())
  .then(data => {
    const entries = (data.entries || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const box = document.getElementById('timeline');

    if (!entries.length) {
      document.getElementById('empty').hidden = false;
      return;
    }

    box.innerHTML = entries.map(e => {
      const added = e.added || [];
      const updated = e.updated || [];
      return `
        <section class="entry">
          <h2 class="date">${esc(e.date)}</h2>
          <p class="counts">新增 ${added.length} 个 · 更新 ${updated.length} 个${e.total ? ' · 当前共 ' + e.total + ' 个' : ''}</p>
          ${added.length ? '<h3>新增数据集</h3><ul>' + added.map(a =>
            '<li><strong>' + esc(a.name) + '</strong>' + (a.summary ? ' — ' + esc(a.summary) : '') + '</li>').join('') + '</ul>' : ''}
          ${updated.length ? '<h3>字段更新</h3><ul>' + updated.map(u =>
            '<li><strong>' + esc(u.name) + '</strong>' + (u.fields && u.fields.length ? ' — ' + esc(u.fields.join('、')) : '') + '</li>').join('') + '</ul>' : ''}
          ${e.note ? '<p class="note">' + esc(e.note) + '</p>' : ''}
        </section>`;
    }).join('');
  })
  .catch(() => {
    document.getElementById('empty').hidden = false;
    document.getElementById('empty').textContent = '无法读取日志文件，请通过本地服务器或 GitHub Pages 访问本页。';
  });
</script>
</body>
</html>
